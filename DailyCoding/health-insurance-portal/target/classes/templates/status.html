<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Application Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3>Insurance Application Status</h3>
        </div>
        <div class="card-body text-center">
            <h5 class="card-title">Policy for: <span th:text="${selectedPlan}">Plan Name</span></h5>
            <p class="card-text">Current Status:</p>
            
            <div th:switch="${status}">
                <span th:case="'Pending'" class="badge bg-warning text-dark fs-4">Pending</span>
                <span th:case="'Approved'" class="badge bg-success fs-4">Approved</span>
                <span th:case="'Rejected'" class="badge bg-danger fs-4">Rejected</span>
            </div>
            
            <hr>
            <p class="text-muted">You will receive an email confirmation once the status changes[cite: 13].</p>
            <a th:href="@{/}" class="btn btn-outline-secondary">Back to Home</a>
        </div>
    </div>
</body>
</html>
