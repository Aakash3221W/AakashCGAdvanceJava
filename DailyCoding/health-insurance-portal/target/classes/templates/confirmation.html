<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Application Submitted</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5 text-center">
    <div class="card shadow-lg p-5">
        <div class="text-success mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
              <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
        </div>
        <h2 class="display-5">Application Submitted!</h2>
        <p class="lead">Thank you for applying for the <strong th:text="${selectedPlan}">Plan Name</strong>.</p>
        <p class="text-muted">Your digital application has replaced the manual paperwork process successfully[cite: 6, 19].</p>
        
        <div class="mt-4">
            <a th:href="@{/status(planName=${selectedPlan})}" class="btn btn-primary btn-lg">Track Application Status</a>
            <a th:href="@{/}" class="btn btn-link text-secondary">Back to Home</a>
        </div>
    </div>
</body>
</html>
