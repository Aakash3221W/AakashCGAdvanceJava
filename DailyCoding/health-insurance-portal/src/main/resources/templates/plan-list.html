<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Available Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-3">Welcome, <span th:text="${name}">User</span>!</h2>
    <p class="text-muted">Choose the most suitable option</p>

    <div class="row">
        <div class="col-md-4" th:each="plan : ${plans}">
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${plan}">Plan Name</h5>
                    <p class="card-text">Replace manual paperwork with digital enrollment</p>
                    <a th:href="@{/apply(planName=${plan})}" class="btn btn-success">Apply Digitally</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
