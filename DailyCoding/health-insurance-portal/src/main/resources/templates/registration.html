<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Health Insurance Registration</h2>
    <form th:action="@{/register}" th:object="${customer}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label>Full Name:</label>
            <input type="text" th:field="*{name}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Age:</label>
            <input type="number" th:field="*{age}" class="form-control" required /> 
        </div>
        <div class="mb-3">
            <label>Email:</label>
            <input type="email" th:field="*{email}" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Register & View Plans</button>
    </form>
</body>
</html>
