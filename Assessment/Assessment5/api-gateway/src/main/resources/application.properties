# Application name
spring.application.name=api-gateway
server.port=8080

# Eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true

# \u2B50 Gateway Routes Configuration

# Route for Passenger Service
# Request: http://localhost:8080/passenger/passengers
# Forwards to: http://passenger-service/passengers
# \u2B50 NEW Route Configuration for Spring Boot 3.5.x
spring.cloud.gateway.server.webflux.routes[0].id=passenger-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://passenger-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/passenger/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=carrentals-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://carrantals-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/carrentals/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# Actuator for monitoring
management.endpoints.web.exposure.include=gateway,health,info,routes