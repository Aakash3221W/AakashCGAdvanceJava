<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 pt-5">
        <div class="card shadow-lg border-0 text-center mx-auto" style="max-width: 500px;">
            <div class="card-body p-5">
                <div class="mb-4 text-success">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                    </svg>
                </div>
                <h1 class="display-5 fw-bold">Thank You!</h1>
                <p class="lead text-muted">Your purchase was successful.</p>
                <div class="bg-light p-3 rounded mb-4">
                    <p class="mb-0">Amount Paid: <strong class="text-primary" th:text="${#numbers.formatDecimal(total, 1, 2)}"></strong></p>
                </div>
                <a th:href="@{/products}" class="btn btn-primary btn-lg w-100">Continue Shopping</a>
            </div>
        </div>
    </div>
</body>
</html>
