<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🛒 Digital Store</a>
        <a th:href="@{/cart}" class="btn btn-outline-light">
            View Cart <span class="badge text-bg-warning" th:text="${cartCount}">0</span>
        </a>
    </div>
</nav>

<div class="container">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title mb-4">Available Products</h3>
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th class="text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${productList}">
                        <td class="fw-bold" th:text="${product.name}"></td>
                        <td th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></td>
                        <form th:action="@{/addToCart}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}" />
                            <td>
                                <input type="number" name="quantity" value="1" min="1" class="form-control form-control-sm" style="width: 80px;">
                            </td>
                            <td class="text-end">
                                <button type="submit" class="btn btn-success btn-sm px-4">Add</button>
                            </td>
                        </form>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
